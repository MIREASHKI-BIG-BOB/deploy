services:
  # Автоматическая активация генератора
  gen-activator:
    image: curlimages/curl:latest
    networks:
      - microservices
    depends_on:
      gen-1:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for generator to be ready...' &&
        sleep 10 &&
        echo 'Activating generator...' &&
        curl -f -X GET http://gen-1:8000/api/on &&
        echo 'Generator activated successfully!' ||
        echo 'Failed to activate generator'
      "
    restart: "no"

  gen-1:
    build: ../services/backend_gen
    env_file:
      - .env.gen1
    ports:
      - "8001:8000"
    networks:
      - microservices
    depends_on:
      main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  main:
    build: ../services/backend_main
    env_file:
      - .env.main
    ports:
      - "8000:8000"
    networks:
      - microservices
    depends_on:
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ml:
    build: ../services/backend_ml
    env_file:
      - .env.ml
    ports:
      - "8010:8000"
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ../../frontend
    ports:
      - "3000:80"
    networks:
      - microservices
    depends_on:
      main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  microservices:
    driver: bridge
